plugins {
    id 'com.android.application'
}

def verCode = project.hasProperty('appVersionCode') ? project.property('appVersionCode').toInteger() : 4
def verName = project.hasProperty('appVersionName') ? project.property('appVersionName').toString() : "2.4"

android {
    namespace 'com.fyt.carlauncher'
    compileSdk 33

    defaultConfig {
        applicationId "com.fyt.carlauncher"
        minSdk 24
        targetSdk 33
        versionCode verCode
        versionName verName
        // Clé Stadia Maps : secret GitHub STADIA_API_KEY (CI) ou propriété -PstadiaApiKey=… en local. Jamais dans le code.
        def stadiaKey = System.getenv("STADIA_API_KEY") ?: (project.findProperty("stadiaApiKey") ?: "")
        buildConfigField "String", "STADIA_API_KEY", "\"${stadiaKey}\""
    }

    signingConfigs {
        release {
            if (file("release.keystore").exists()) {
                storeFile file("release.keystore")
                storePassword System.getenv("KEYSTORE_PASS") ?: "carlauncher"
                keyAlias System.getenv("KEY_ALIAS") ?: "carlauncher"
                keyPassword System.getenv("KEY_PASS") ?: System.getenv("KEYSTORE_PASS") ?: "carlauncher"
            }
        }
    }

    buildTypes {
        release {
            if (file("release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            shrinkResources false
        }
        debug {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
}
