plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fyt.carlauncher'
    compileSdk 33

    defaultConfig {
        applicationId "com.fyt.carlauncher"
        minSdk 24
        targetSdk 33
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Carte GPS OpenStreetMap native légère (sans AndroidX, sans clé API Google)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'
}
