plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fyt.carlauncher'
    compileSdk 33

    defaultConfig {
        applicationId "com.fyt.carlauncher"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Aucune dépendance externe (pas d'AndroidX, pas de Compose, pas de WebView)
    // Empreinte RAM minimale pour autoradio 1 Go RAM.
}
