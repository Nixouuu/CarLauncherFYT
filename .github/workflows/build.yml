name: Build CarLauncherFYT APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle (without wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK (Signed Release if secret set, else Debug)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
            gradle assembleRelease -PappVersionCode=${{ github.run_number }} -PappVersionName=2.${{ github.run_number }} --no-daemon --stacktrace
            cp app/build/outputs/apk/release/app-release.apk CarLauncherFYT.apk
          else
            gradle assembleDebug -PappVersionCode=${{ github.run_number }} -PappVersionName=2.${{ github.run_number }} --no-daemon --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk CarLauncherFYT.apk
          fi

      - name: Upload CarLauncherFYT.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLauncherFYT-apk
          path: CarLauncherFYT.apk
          if-no-files-found: error

      - name: Publish GitHub Release (OTA)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: CarLauncher FYT v2.${{ github.run_number }}
          files: CarLauncherFYT.apk
